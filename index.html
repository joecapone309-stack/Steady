<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f5f1ea" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="steady-icon.svg" />
<meta name="application-name" content="Steady" />
<meta name="apple-mobile-web-app-title" content="Steady" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="Steady helps you slow down, regulate, connect, and make the next healthy decision." />
<title>Steady</title>
<style>
:root{--bg:#f5f1ea;--card:#fff;--ink:#1e2a28;--muted:#687571;--accent:#426b63;--accent2:#dfeae6;--line:#d9dfdc;--danger:#a23f3f;--dangerbg:#fff1f1;--warn:#8a6116;--warnbg:#fff7e5;--shadow:0 8px 28px rgba(24,48,43,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}.app{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:2px 0 14px}.brand{font-size:30px;font-weight:850;letter-spacing:-.03em}.tag{font-size:12px;color:var(--muted)}button,input,textarea,select{font:inherit}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}h1{font-size:27px;line-height:1.08;margin:4px 0 8px}h2{font-size:22px;line-height:1.15;margin:4px 0 8px}h3{font-size:17px;margin:4px 0 8px}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}.kicker,.step{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin-bottom:6px}.bigbtn,.btn,.chip,.callbtn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:13px;padding:12px 14px;font-weight:750;cursor:pointer}.bigbtn{display:block;width:100%;background:var(--accent);border-color:var(--accent);color:white;font-size:17px;padding:15px;margin:10px 0}.bigbtn.secondary{background:white;color:var(--ink);border-color:var(--line)}.bigbtn.risk{background:#8f4641;border-color:#8f4641}.btn{width:100%;text-align:left}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{padding:9px 11px;border-radius:999px;font-size:14px}.chip.selected{background:var(--accent2);border-color:var(--accent);color:#244a43}.chip.strongest{background:var(--accent);color:white;border-color:var(--accent)}label{display:block;font-size:13px;font-weight:800;margin:13px 0 5px}input[type=text],input[type=tel],input[type=url],textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;color:var(--ink)}textarea{min-height:96px;resize:vertical}input[type=range]{width:100%}.rangeval{font-size:32px;font-weight:850;margin:2px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.notice{border-left:4px solid var(--accent);background:#eef5f2;padding:11px 12px;border-radius:10px;margin:10px 0}.notice.warn{border-left-color:var(--warn);background:var(--warnbg)}.notice.danger{border-left-color:var(--danger);background:var(--dangerbg)}.supportbar{display:flex;gap:8px;overflow:auto;padding:2px 0 5px}.supportperson{min-width:195px;border:1px solid var(--line);padding:12px;border-radius:14px;background:white}.callbtn{display:inline-block;text-decoration:none;background:var(--accent);color:white;border-color:var(--accent);padding:9px 12px;margin-top:7px}.dangercall{background:var(--danger);border-color:var(--danger)}.hr{height:1px;background:var(--line);margin:16px 0}.pill{display:inline-block;background:#eef2f0;border-radius:999px;padding:5px 9px;font-size:12px;margin:2px}.progress{height:9px;background:#e6ece9;border-radius:99px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:var(--accent)}.contactrow{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.contactgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}.chatbox{display:flex;flex-direction:column;gap:9px;max-height:50vh;overflow:auto;padding:3px 1px;margin:10px 0}.bubble{max-width:90%;padding:11px 13px;border-radius:16px;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:var(--accent);color:white;border-bottom-right-radius:5px}.bubble.steady{align-self:flex-start;background:#edf3f0;border-bottom-left-radius:5px}.compose{display:grid;grid-template-columns:1fr auto;gap:8px}.micbtn{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;font-weight:800}.quick{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.quick button{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 10px}.voice-panel{background:white;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;display:none}.voice-panel.show{display:block}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(12px)}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;padding:12px 4px;font-size:11px;color:var(--muted)}.nav button.active{color:var(--ink);font-weight:850}.hidden{display:none!important}.source{border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0}.source b{display:block}.toggleline{display:flex;justify-content:space-between;align-items:center;gap:10px}.setupdot{display:flex;gap:5px}.setupdot i{width:8px;height:8px;border-radius:50%;background:#d3d9d6}.setupdot i.on{background:var(--accent)}footer{font-size:11px;color:var(--muted);padding:16px 2px}
@media(max-width:540px){.grid2,.contactgrid{grid-template-columns:1fr}.brand{font-size:27px}.app{padding-left:11px;padding-right:11px}.card{padding:14px}.compose{grid-template-columns:1fr}.supportperson{min-width:175px}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">Steady</div><div class="tag">One better decision at a time.</div></div><div class="row wrap" style="justify-content:flex-end"><button class="chip hidden" onclick="installSteady()" id="installBtn">⬇️ Install</button><button class="chip" onclick="toggleVoice()" id="voiceToggle">🔊 Voice</button></div></header>
<div id="voicePanel" class="voice-panel"><div class="row"><b class="small">Steady says</b><button class="chip" onclick="replayVoice()">Replay</button></div><div id="voiceText" class="small"></div></div>
<main id="view"></main>
<footer>Steady is a support and self-regulation tool, not a substitute for emergency services, medical care, diagnosis, psychotherapy, or addiction treatment. If there is immediate danger, call emergency services or get another person physically involved.</footer>
</div>
<div class="nav" id="nav"><div class="navin"><button id="nav-home" onclick="showHome()">Home</button><button id="nav-now" onclick="startNow(false)">Steady Now</button><button id="nav-support" onclick="showSupport()">Support</button><button id="nav-library" onclick="showLibrary()">Sources</button><button id="nav-me" onclick="showMe()">Me</button></div></div>
<script>
const view=document.getElementById('view');
const KEY='steady_v07_profile', EVENTS='steady_v07_events';
const FEELINGS=['Angry','Anxious','Afraid','Rejected','Lonely','Sad','Ashamed','Guilty','Resentful','Overwhelmed','Restless','Grieving','Hopeless','Craving','Tired','Confused','Other'];
const ISSUES=['Alcohol','Drugs','Pornography / sexual acting out','Nicotine','Gambling','Food / binge eating','Compulsive spending','Anger / aggression','Relationship conflict','Isolation','People-pleasing','Control / checking','Self-criticism','Sleep-aid misuse','Other'];
const URGES=['Drink','Use drugs','Look at pornography / sexual acting out','Smoke / nicotine','Gamble','Binge / overeat','Spend money','Argue / lash out','Send or repeat messages','Check / control','Isolate','Leave impulsively','Hurt myself','Hurt someone','Something else','I do not know'];
const VALUES=['Sober','Loving','Honest','Faithful','Patient','Responsible','Connected','Safe','Courageous','Dependable','Healthy','Present','Kind','Self-respecting'];
const DEFAULT={name:'',story:'',goals:'',issues:[],triggers:[],warnings:[],behaviors:[],values:['Safe','Honest','Connected'],contacts:[],faithMode:'gentle',bibleTranslation:'KJV',sources:{bible:true,aa:true,trauma:true,clinical:true,motherHunger:true,emotionalSobriety:true},responseStyle:'warm',voice:{enabled:true,voiceURI:'',rate:.92,pitch:1,auto:true},aiEndpoint:'',setupComplete:false};
let profile=loadProfile(), setupStep=0, state={}, chatHistory=[], lastSpoken='', activeRecognition=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]));}
function jsq(s=''){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');}
function lines(s=''){return String(s).split('\n').map(x=>x.trim()).filter(Boolean)}
function loadProfile(){try{return deep({...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')})}catch(e){return deep(DEFAULT)}}
function deep(p){p.contacts=Array.isArray(p.contacts)?p.contacts:[];p.issues=Array.isArray(p.issues)?p.issues:[];p.triggers=Array.isArray(p.triggers)?p.triggers:[];p.warnings=Array.isArray(p.warnings)?p.warnings:[];p.behaviors=Array.isArray(p.behaviors)?p.behaviors:[];p.values=Array.isArray(p.values)?p.values:[];p.sources={...DEFAULT.sources,...(p.sources||{})};p.voice={...DEFAULT.voice,...(p.voice||{})};return p}
function saveProfile(){localStorage.setItem(KEY,JSON.stringify(profile));updateVoiceToggle()}
function saveEvent(e){const a=JSON.parse(localStorage.getItem(EVENTS)||'[]');a.unshift(e);localStorage.setItem(EVENTS,JSON.stringify(a.slice(0,200)))}
function init(){updateVoiceToggle();if(!profile.setupComplete)renderSetup();else showHome();}
function setNav(n){['home','now','support','library','me'].forEach(x=>{const b=document.getElementById('nav-'+x);if(b)b.classList.toggle('active',x===n)})}
function setupDots(){return `<div class="setupdot">${[0,1,2,3,4,5].map(i=>`<i class="${i<=setupStep?'on':''}"></i>`).join('')}</div>`}
function renderSetup(){setNav('me');const steps=[setupIntro,setupStory,setupPatterns,setupSupport,setupVoice,setupSources];(steps[setupStep]||setupIntro)()}
function setupIntro(){view.innerHTML=`<div class="card"><div class="row"><div class="kicker">First-time setup</div>${setupDots()}</div><h1>Make Steady yours.</h1><p class="muted">Do this while you are relatively calm. Steady will use what you tell it to make future moments more personal and useful.</p><label>What should Steady call you?</label><input id="sname" type="text" value="${esc(profile.name)}" placeholder="First name or nickname"><label>What are you trying to protect, change, or build?</label><textarea id="sgoals" placeholder="Examples: sobriety, my marriage, peace, honesty, staying connected, not acting impulsively">${esc(profile.goals)}</textarea><button class="bigbtn" onclick="saveSetup0()">Continue</button></div>`}
function saveSetup0(){profile.name=document.getElementById('sname').value.trim();profile.goals=document.getElementById('sgoals').value.trim();saveProfile();setupStep=1;renderSetup()}
function setupStory(){view.innerHTML=`<div class="card"><div class="row"><div class="kicker">Your story</div>${setupDots()}</div><h1>Help Steady understand you.</h1><p class="muted">Tell as much or as little as you want. This prototype stores this profile on this browser/device.</p><label>What experiences shaped the way you react when you feel hurt, rejected, afraid, angry, lonely, or overwhelmed?</label><textarea id="sstory" style="min-height:190px" placeholder="You can include relationships, recovery history, losses, trauma, faith, family patterns, what has helped before…">${esc(profile.story)}</textarea>${micRow('sstory')}<button class="bigbtn" onclick="saveSetup1()">Continue</button></div>`}
function saveSetup1(){profile.story=document.getElementById('sstory').value.trim();saveProfile();setupStep=2;renderSetup()}
function toggleArray(k,v){const a=profile[k]||[];profile[k]=a.includes(v)?a.filter(x=>x!==v):[...a,v];saveProfile()}
function setupPatterns(){view.innerHTML=`<div class="card"><div class="row"><div class="kicker">Patterns</div>${setupDots()}</div><h1>What should Steady watch for?</h1><label>Issues, addictions, or negative behaviors</label><div class="chips">${ISSUES.map(x=>`<button class="chip ${profile.issues.includes(x)?'selected':''}" onclick="toggleArray('issues','${jsq(x)}');setupPatterns()">${esc(x)}</button>`).join('')}</div><label>Common triggers — one per line</label><textarea id="striggers" placeholder="Rejection\nConflict\nLoneliness\nMoney stress">${esc(profile.triggers.join('\n'))}</textarea><label>Early warning signs — one per line</label><textarea id="swarnings" placeholder="Racing thoughts\nWanting to escape\nPacing\nThinking “what's the use?”">${esc(profile.warnings.join('\n'))}</textarea><label>Behaviors Steady should help interrupt — one per line</label><textarea id="sbehaviors" placeholder="Drinking\nPornography\nAngry messages\nIsolation">${esc(profile.behaviors.join('\n'))}</textarea><button class="bigbtn" onclick="saveSetup2()">Continue</button></div>`}
function saveSetup2(){profile.triggers=lines(document.getElementById('striggers').value);profile.warnings=lines(document.getElementById('swarnings').value);profile.behaviors=lines(document.getElementById('sbehaviors').value);saveProfile();setupStep=3;renderSetup()}
function contactsEditor(){return `<div id="contactList">${profile.contacts.map((c,i)=>`<div class="contactrow"><div class="contactgrid"><div><label>Name</label><input type="text" value="${esc(c.name||'')}" onchange="editContact(${i},'name',this.value)"></div><div><label>Role</label><input type="text" value="${esc(c.role||'')}" placeholder="Sponsor / therapist / friend" onchange="editContact(${i},'role',this.value)"></div></div><label>Phone</label><input type="tel" value="${esc(c.phone||'')}" onchange="editContact(${i},'phone',this.value)"><div class="row wrap" style="margin-top:8px"><label style="margin:0"><input type="checkbox" ${c.priority?'checked':''} onchange="editContact(${i},'priority',this.checked)"> Show as priority support</label><button class="chip" onclick="removeContact(${i})">Remove</button></div></div>`).join('')}</div><button class="btn" onclick="addContact()">+ Add support person</button>`}
function addContact(){profile.contacts.push({name:'',role:'',phone:'',priority:false});saveProfile();renderSetupOrMe()}
function removeContact(i){profile.contacts.splice(i,1);saveProfile();renderSetupOrMe()}
function editContact(i,k,v){profile.contacts[i][k]=v;saveProfile()}
function renderSetupOrMe(){if(!profile.setupComplete&&setupStep===3)setupSupport();else showMe()}
function setupSupport(){view.innerHTML=`<div class="card"><div class="row"><div class="kicker">Human support</div>${setupDots()}</div><h1>Who can Steady help you call?</h1><p class="muted">Add counselors, sponsors, support members, therapists, trusted friends, or family. Their call buttons can appear during a struggle.</p>${contactsEditor()}<button class="bigbtn" onclick="setupStep=4;renderSetup()">Continue</button></div>`}
function availableVoices(){return window.speechSynthesis?window.speechSynthesis.getVoices():[]}
function voiceEditor(){const vs=availableVoices();return `<label>Voice</label><select id="vvoice">${vs.length?vs.map(v=>`<option value="${esc(v.voiceURI)}" ${profile.voice.voiceURI===v.voiceURI?'selected':''}>${esc(v.name)} — ${esc(v.lang)}</option>`).join(''):'<option value="">Device default voice</option>'}</select><label>Speaking speed: <span id="vrateLabel">${profile.voice.rate}</span></label><input id="vrate" type="range" min="0.65" max="1.25" step="0.05" value="${profile.voice.rate}" oninput="document.getElementById('vrateLabel').textContent=this.value"><label>Pitch: <span id="vpitchLabel">${profile.voice.pitch}</span></label><input id="vpitch" type="range" min="0.7" max="1.25" step="0.05" value="${profile.voice.pitch}" oninput="document.getElementById('vpitchLabel').textContent=this.value"><div class="toggleline"><label><input id="vauto" type="checkbox" ${profile.voice.auto?'checked':''}> Automatically read Steady's responses aloud</label><button class="chip" onclick="testVoiceFromForm()">Test voice</button></div>`}
function saveVoiceInputs(){const vv=document.getElementById('vvoice');if(vv)profile.voice.voiceURI=vv.value;const r=document.getElementById('vrate');if(r)profile.voice.rate=+r.value;const p=document.getElementById('vpitch');if(p)profile.voice.pitch=+p.value;const a=document.getElementById('vauto');if(a)profile.voice.auto=a.checked;saveProfile()}
function setupVoice(){view.innerHTML=`<div class="card"><div class="row"><div class="kicker">Voice</div>${setupDots()}</div><h1>Choose a voice you can receive direction from.</h1><p class="muted">The available choices come from voices installed on this device/browser. Later, Steady can add premium AI voices on the secure server.</p>${voiceEditor()}<button class="bigbtn" onclick="saveVoiceInputs();setupStep=5;renderSetup()">Continue</button></div>`;refreshVoicesSoon()}
function refreshVoicesSoon(){if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=()=>{if(!profile.setupComplete&&setupStep===4)setupVoice()}}}
function testVoiceFromForm(){saveVoiceInputs();speak('This is Steady. I am here to help you slow the moment down and protect the next decision.',true)}
function referencesEditor(showButton=true){const S=profile.sources;return `<label>Faith / Bible use</label><select id="faithMode" onchange="profile.faithMode=this.value;saveProfile()"><option value="off" ${profile.faithMode==='off'?'selected':''}>Off unless I ask</option><option value="gentle" ${profile.faithMode==='gentle'?'selected':''}>Gentle — only when relevant</option><option value="forward" ${profile.faithMode==='forward'?'selected':''}>Faith-forward</option></select><div class="source"><b>Bible / Scripture</b><span class="small muted">Values, hope, wisdom, prayer and spiritual grounding without forcing a sermon.</span><label><input type="checkbox" ${S.bible?'checked':''} onchange="profile.sources.bible=this.checked;saveProfile()"> Use as an approved reference</label></div><div class="source"><b>AA / recovery literature</b><span class="small muted">12-step structure, Big Book concepts and other permitted recovery resources. Full copyrighted books require licensed/authorized retrieval.</span><label><input type="checkbox" ${S.aa?'checked':''} onchange="profile.sources.aa=this.checked;saveProfile()"> Use as an approved recovery framework</label></div><div class="source"><b>Trauma / attachment</b><span class="small muted">Evidence-informed trauma, attachment and nervous-system concepts.</span><label><input type="checkbox" ${S.trauma?'checked':''} onchange="profile.sources.trauma=this.checked;saveProfile()"> Use trauma-informed structure</label></div><div class="source"><b>Mother Hunger & Emotional Sobriety</b><span class="small muted">Use concepts where legally permitted; do not redistribute copyrighted books.</span><label><input type="checkbox" ${S.motherHunger?'checked':''} onchange="profile.sources.motherHunger=this.checked;saveProfile()"> Mother Hunger concepts</label><label><input type="checkbox" ${S.emotionalSobriety?'checked':''} onchange="profile.sources.emotionalSobriety=this.checked;saveProfile()"> Emotional Sobriety concepts</label></div><div class="source"><b>Clinical & trusted web information</b><span class="small muted">Prefer government, major medical, professional and primary sources over generic web results.</span><label><input type="checkbox" ${S.clinical?'checked':''} onchange="profile.sources.clinical=this.checked;saveProfile()"> Use trusted current sources when AI is connected</label></div>${showButton?'<button class="bigbtn" onclick="finishSetup()">Finish setup</button>':''}`}
function setupSources(){view.innerHTML=`<div class="card"><div class="row"><div class="kicker">References</div>${setupDots()}</div><h1>What may Steady draw from?</h1><p class="muted">You stay in control of the kind of guidance Steady uses.</p>${referencesEditor(true)}</div>`}
function finishSetup(){profile.setupComplete=true;saveProfile();speak('Your Steady plan is ready. When you need it, tap Steady Now.');showHome()}
function showHome(){setNav('home');const n=profile.name?`, ${profile.name}`:'';view.innerHTML=`<div class="card"><div class="kicker">Your personal regulation plan</div><h1>I'm here${n}.</h1><p class="muted">You do not have to solve the whole problem. Protect the next decision.</p><button class="bigbtn risk" onclick="startNow(true)">I am close to acting out</button><button class="bigbtn" onclick="startNow(false)">I'm struggling right now</button><div class="grid2"><button class="btn" onclick="showSupport()">Call someone</button><button class="btn" onclick="startCheckIn()">Daily check-in</button></div></div>${supportStrip(false)}<div class="card"><h3>What Steady already knows</h3><div>${profile.issues.slice(0,8).map(x=>`<span class="pill">${esc(x)}</span>`).join('')||'<span class="muted small">Complete your profile so Steady can personalize this.</span>'}</div><button class="btn" style="margin-top:10px" onclick="showMe()">Edit my Steady profile</button></div>`}
function freshState(highRisk=false){return{highRisk,feelings:[],primary:'',intensity:5,event:'',urge:'',urgeIntensity:5,post:5,fact:'',story:'',value:'',action:'',stage:0,started:new Date().toISOString()}}
function startNow(highRisk=false){state=freshState(highRisk);chatHistory=[];setNav('now');renderFeelings(true)}
function renderFeelings(announce=false){const prompt='Choose all the feelings that fit. You will rate the strongest one next.';view.innerHTML=`<div class="card"><div class="step">Notice → Name</div><h1>What are you feeling?</h1><p class="muted">${prompt}</p><div class="chips">${FEELINGS.map(f=>`<button class="chip ${state.feelings.includes(f)?'selected':''}" onclick="toggleFeeling('${jsq(f)}')">${esc(f)}</button>`).join('')}</div><button class="bigbtn" onclick="goPrimary()">Next: choose the strongest</button></div>`;if(announce)speak(prompt)}
function toggleFeeling(f){state.feelings=state.feelings.includes(f)?state.feelings.filter(x=>x!==f):[...state.feelings,f];renderFeelings(false)}
function goPrimary(){if(!state.feelings.length){alert('Choose at least one feeling.');return}renderPrimary()}
function renderPrimary(){view.innerHTML=`<div class="card"><div class="step">Name</div><h1>Which feeling is strongest right now?</h1><div class="chips">${state.feelings.map(f=>`<button class="chip ${state.primary===f?'strongest':''}" onclick="state.primary='${jsq(f)}';renderPrimary()">${esc(f)}</button>`).join('')}</div>${state.primary?`<label>How strong is ${esc(state.primary.toLowerCase())}?</label><div class="rangeval" id="ival">${state.intensity}</div><input id="intensity" type="range" min="0" max="10" value="${state.intensity}" oninput="document.getElementById('ival').textContent=this.value"><button class="bigbtn" onclick="submitPrimary()">Continue</button>`:'<p class="small muted">Tap one feeling.</p>'}</div>`}
function submitPrimary(){state.intensity=+document.getElementById('intensity').value;if(state.highRisk||state.intensity>=8)renderRegulate();else renderWhatHappened()}
function renderRegulate(){view.innerHTML=`<div class="card"><div class="step">${state.intensity>=9?'Protect':'Regulate'}</div><h1>First, make room for a choice.</h1><p class="muted">Do not decide the whole problem while you are this activated.</p><div class="notice">Put both feet down. Drop your shoulders. Take five slow breaths, longer out than in.</div><div class="notice">Create distance from the thing you may act on. Move rooms, put it down, hand it off, or go somewhere safer.</div>${profile.contacts.filter(c=>c.priority&&c.phone).length?supportStrip(false):''}<label>Intensity after doing that</label><div class="rangeval" id="postv">${Math.max(0,state.intensity-1)}</div><input id="post" type="range" min="0" max="10" value="${Math.max(0,state.intensity-1)}" oninput="document.getElementById('postv').textContent=this.value"><button class="bigbtn" onclick="state.post=+document.getElementById('post').value;renderWhatHappened()">Continue</button></div>`;speak('Do not solve everything right now. Create a little space between the feeling and the next action.')}
function renderWhatHappened(){view.innerHTML=`<div class="card"><div class="step">What happened?</div><h1>Tell me the event.</h1><p class="muted">Start with what actually happened before deciding what it means.</p><textarea id="event" placeholder="What happened right before this feeling showed up?">${esc(state.event)}</textarea>${micRow('event')}<button class="bigbtn" onclick="saveWhatHappened()">Continue</button></div>`}
function saveWhatHappened(){const e=document.getElementById('event');state.event=e?e.value.trim():state.event;renderUrge()}
function renderUrge(){view.innerHTML=`<div class="card"><div class="step">Urge / acting-out method</div><h1>What do you feel pulled to do?</h1><div class="chips">${URGES.map(u=>`<button class="chip ${state.urge===u?'selected':''}" onclick="chooseUrge('${jsq(u)}')">${esc(u)}</button>`).join('')}</div>${state.urge?`<div class="notice"><b>Selected:</b> ${esc(state.urge)}</div><label>How strong is the urge?</label><div class="rangeval" id="uval">${state.urgeIntensity}</div><input id="urgeIntensity" type="range" min="0" max="10" value="${state.urgeIntensity}" oninput="document.getElementById('uval').textContent=this.value"><button class="bigbtn" onclick="continueFromUrge()">Talk me through it</button>`:''}</div>`}
function chooseUrge(u){state.urge=u;renderUrge()}
function continueFromUrge(){const r=document.getElementById('urgeIntensity');if(r)state.urgeIntensity=+r.value;if(['Hurt myself','Hurt someone'].includes(state.urge)){renderSafety();return}renderChat()}
function renderChat(){state.stage=state.stage||0;if(!chatHistory.length){const opening=buildOpening();chatHistory.push({role:'steady',text:opening});if(profile.voice.auto)speak(opening)}view.innerHTML=`<div class="card"><div class="step">Conversation mode</div><h1>Stay with the next right action.</h1><div class="chatbox" id="chatbox">${chatHistory.map(m=>`<div class="bubble ${m.role==='user'?'user':'steady'}">${esc(m.text)}</div>`).join('')}</div><div class="quick">${quickPrompts().map(q=>`<button onclick="sendQuick('${jsq(q)}')">${esc(q)}</button>`).join('')}</div><div class="compose"><textarea id="chatInput" style="min-height:58px" placeholder="Talk to Steady…"></textarea><button class="micbtn" onclick="startMic('chatInput')">🎙️</button></div><button class="bigbtn" onclick="sendChat()">Send</button>${supportStrip(false)}</div>`;setTimeout(()=>{const b=document.getElementById('chatbox');if(b)b.scrollTop=b.scrollHeight},20)}
function buildOpening(){const all=state.feelings.filter(x=>x!==state.primary);let s=`You are feeling ${state.primary.toLowerCase()} at ${state.intensity} out of 10`;if(all.length)s+=`, with ${all.join(', ').toLowerCase()} also present`;if(state.urge)s+=`. The pull right now is to ${state.urge.toLowerCase()}`;s+=`. I want to help you slow this down, understand what is true, and choose the next action that protects what matters to you.`;return s}
function quickPrompts(){if(state.stage===0)return['Help me separate fact from story','I feel rejected','The urge is getting stronger','I need a human being'];if(state.stage===1)return['What is actually true?','Give me a both/and statement','What should I do next?','Call someone'];return['Next right action','Help me pray / reflect','I need support','I feel calmer now']}
function sendQuick(q){const i=document.getElementById('chatInput');if(i)i.value=q;sendChat()}
async function sendChat(){const i=document.getElementById('chatInput');const text=i?i.value.trim():'';if(!text)return;chatHistory.push({role:'user',text});const lower=text.toLowerCase();if(/hurt myself|kill myself|suicide|hurt someone|kill someone|not safe/.test(lower)){renderSafety();return}chatHistory.push({role:'steady',text:'…'});renderChat();const placeholder=chatHistory.length-1;let reply='';try{reply=await getAIReply(text)}catch(e){reply=localCoach(text)}chatHistory[placeholder]={role:'steady',text:reply};state.stage=Math.min(3,(state.stage||0)+1);renderChat();if(profile.voice.auto)speak(reply)}
async function getAIReply(text){if(!profile.aiEndpoint)throw new Error('local');const payload={profile:{name:profile.name,story:profile.story,goals:profile.goals,issues:profile.issues,triggers:profile.triggers,warnings:profile.warnings,behaviors:profile.behaviors,values:profile.values,faithMode:profile.faithMode,sources:profile.sources},moment:state,history:chatHistory.filter(x=>x.text!=='…').slice(-12),message:text};const r=await fetch(profile.aiEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error('AI server unavailable');const d=await r.json();return d.reply||d.message||localCoach(text)}
function localCoach(text){const t=text.toLowerCase();if(/human|call someone|support|sponsor|therapist|friend/.test(t))return profile.contacts.some(c=>c.phone)?'Good. Getting another nervous system into the moment is a strong next action. Use one of your support buttons below. You do not need to explain everything perfectly; simply say you are activated and want help staying with your next healthy decision.':'Good instinct. You do not have a support contact saved yet. Move toward a safe person or public place, and add support contacts to Steady when you are calm.';if(/fact|story|true/.test(t))return `Start with the camera-view fact: ${state.event||'something happened and your nervous system reacted'}. Now notice the story your mind is adding—especially words like “always,” “never,” “nobody,” or conclusions about what someone else must be thinking. The feeling is real even if every conclusion is not yet proven.`;if(/rejected|alone|lonely/.test(t))return 'Rejection and loneliness can make immediate relief feel more important than tomorrow. Both can be true: you can feel deeply unwanted right now, and acting out can still make the situation worse. The next goal is connection without surrendering responsibility for your regulation.';if(/urge|stronger|drink|porn|smoke|drug|gambl/.test(t))return `Do not negotiate with the whole future. Protect the next 20 minutes. Put distance between you and ${state.urge?state.urge.toLowerCase():'the acting-out option'}, change location if you can, drink water, and bring another person into the moment. An urge is information, not an instruction.`;if(/pray|bible|god|faith/.test(t)&&profile.faithMode!=='off')return 'You can bring the moment to God without pretending you feel better than you do. A simple prayer is enough: “God, help me see what is true and do the next right thing.” Then take one concrete action that matches that prayer—distance from the urge, honesty, or connection.';const v=(profile.values&&profile.values[0])||'safe';return `I hear you. Before you make the big decision, ask two questions: “What do I know for certain?” and “What action would the ${v.toLowerCase()} version of me take for the next 20 minutes?” We can work the rest out after your nervous system comes down.`}
function renderSafety(){const people=profile.contacts.filter(c=>c.phone);view.innerHTML=`<div class="card"><div class="notice danger"><b>Get another person involved now.</b><br>If you may hurt yourself or someone else, are in immediate danger, or have a medical emergency, do not stay alone with it.</div><h2>Immediate help</h2><div class="grid2"><a class="callbtn dangercall" href="tel:911">Call 911</a><a class="callbtn" href="tel:988">Call 988</a></div><p class="small muted">In the U.S., 988 provides 24/7 crisis support. If you are outside the U.S., use your local emergency/crisis number.</p><h3>Your people</h3>${people.length?people.map(contactCard).join(''):'<p class="muted">No personal support contacts are saved yet.</p>'}<button class="bigbtn secondary" onclick="renderChat()">I am safe enough to continue with Steady</button></div>`;speak('Get another person involved now. Use one of the call buttons on the screen.')}
function phoneHref(p=''){return 'tel:'+String(p).replace(/[^0-9+*#]/g,'')}
function contactCard(c){return `<div class="supportperson"><b>${esc(c.name||'Support person')}</b><div class="small muted">${esc(c.role||'Trusted support')}</div>${c.phone?`<a class="callbtn" href="${phoneHref(c.phone)}">Call ${esc(c.name||'now')}</a>`:''}</div>`}
function supportStrip(expanded=false){const cs=profile.contacts.filter(c=>c.phone).sort((a,b)=>(b.priority?1:0)-(a.priority?1:0)).slice(0,expanded?5:3);if(!cs.length)return `<div class="card"><div class="small muted">No support contacts saved yet. <button class="chip" onclick="showMe()">Add contacts</button></div></div>`;return `<div class="card"><div class="row"><b>Human support</b><button class="chip" onclick="showSupport()">All</button></div><div class="supportbar">${cs.map(contactCard).join('')}</div></div>`}
function showSupport(){setNav('support');const cs=profile.contacts.filter(c=>c.phone).sort((a,b)=>(b.priority?1:0)-(a.priority?1:0));view.innerHTML=`<div class="card"><h1>Call a human being.</h1><p class="muted">Support is welcome. Regulation is your responsibility—but you do not have to do it alone.</p><div class="supportbar" style="flex-wrap:wrap;overflow:visible">${cs.length?cs.map(contactCard).join(''):'<p>No contacts yet.</p>'}</div><button class="bigbtn secondary" onclick="showMe()">Manage support contacts</button></div><div class="card"><h3>Crisis support</h3><div class="grid2"><a class="callbtn dangercall" href="tel:911">Call 911</a><a class="callbtn" href="tel:988">Call 988</a></div></div>`}
function showLibrary(){setNav('library');view.innerHTML=`<div class="card"><h1>Steady reference policy</h1><p class="muted">The goal is source-guided conversation—not random internet advice and not aggressive quoting.</p>${referencesEditor(false)}<div class="notice warn small"><b>Prototype limitation:</b> this single-file version does not download or redistribute whole copyrighted books. The secure AI service will need a licensed/reference library and retrieval layer so Steady can cite or use permitted material correctly.</div></div>`}
function showMe(){setNav('me');view.innerHTML=`<div class="card"><h1>My Steady profile</h1><label>Name</label><input id="mname" value="${esc(profile.name)}"><label>My story</label><textarea id="mstory" style="min-height:150px">${esc(profile.story)}</textarea><label>What I am trying to protect / build</label><textarea id="mgoals">${esc(profile.goals)}</textarea><label>Issues / addictions / behaviors</label><div class="chips">${ISSUES.map(x=>`<button class="chip ${profile.issues.includes(x)?'selected':''}" onclick="toggleArray('issues','${jsq(x)}');showMe()">${esc(x)}</button>`).join('')}</div><label>Triggers</label><textarea id="mtriggers">${esc(profile.triggers.join('\n'))}</textarea><label>Warning signs</label><textarea id="mwarnings">${esc(profile.warnings.join('\n'))}</textarea><label>Behaviors to interrupt</label><textarea id="mbehaviors">${esc(profile.behaviors.join('\n'))}</textarea><label>Values</label><div class="chips">${VALUES.map(x=>`<button class="chip ${profile.values.includes(x)?'selected':''}" onclick="toggleArray('values','${jsq(x)}');showMe()">${esc(x)}</button>`).join('')}</div><button class="bigbtn" onclick="saveMe()">Save profile</button></div><div class="card"><h2>Support contacts</h2>${contactsEditor()}</div><div class="card"><h2>Voice & conversation</h2>${voiceEditor()}<button class="bigbtn secondary" onclick="saveVoiceInputs()">Save voice settings</button></div><div class="card"><h2>Advanced</h2><button class="btn" onclick="restartSetup()">Run first-time setup again</button><button class="btn" style="margin-top:8px" onclick="clearPrototype()">Delete prototype data from this device</button></div>`;refreshVoicesSoon()}
function saveMe(){profile.name=document.getElementById('mname').value.trim();profile.story=document.getElementById('mstory').value.trim();profile.goals=document.getElementById('mgoals').value.trim();profile.triggers=lines(document.getElementById('mtriggers').value);profile.warnings=lines(document.getElementById('mwarnings').value);profile.behaviors=lines(document.getElementById('mbehaviors').value);saveProfile();alert('Steady profile saved.')}
function restartSetup(){saveMe();setupStep=0;profile.setupComplete=false;saveProfile();renderSetup()}
function clearPrototype(){if(confirm('Delete Steady profile, support contacts and saved moments from this browser?')){localStorage.removeItem(KEY);localStorage.removeItem(EVENTS);profile=loadProfile();setupStep=0;renderSetup()}}
function micRow(id){return `<div class="row wrap" style="margin-top:8px"><button class="micbtn" onclick="startMic('${id}')">🎙️ Speak instead</button><span class="small muted" id="micStatus">${SR?'Microphone available if your browser permits it.':'Speech-to-text is not available in this browser; typing still works.'}</span></div>`}
function startMic(id){if(!SR){alert('Speech-to-text is not available in this browser. You can still type.');return}try{if(activeRecognition)activeRecognition.abort();const r=new SR();activeRecognition=r;r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;const st=document.getElementById('micStatus');if(st)st.textContent='Listening…';r.onresult=e=>{const text=e.results[0][0].transcript;const el=document.getElementById(id);if(el)el.value=(el.value?el.value+' ':'')+text};r.onerror=e=>{if(st)st.textContent='Microphone could not transcribe. You can type instead.'};r.onend=()=>{if(st)st.textContent='Microphone stopped.';activeRecognition=null};r.start()}catch(e){alert('Microphone could not start. You can type instead.')}}
function startCheckIn(){state={};setNav('now');view.innerHTML=`<div class="card"><div class="step">Daily check-in</div><h1>What is your nervous system carrying today?</h1><p class="muted">For now, the check-in uses the same multi-feeling entry and strongest-feeling rating as Steady Now.</p><button class="bigbtn" onclick="startNow(false)">Start check-in</button></div>`}
function updateVoiceToggle(){const b=document.getElementById('voiceToggle');if(b)b.textContent=profile.voice.enabled?'🔊 Voice':'🔇 Voice'}
function toggleVoice(){profile.voice.enabled=!profile.voice.enabled;saveProfile();if(!profile.voice.enabled&&window.speechSynthesis)window.speechSynthesis.cancel()}
function speak(text,force=false){lastSpoken=text;const panel=document.getElementById('voicePanel'),vt=document.getElementById('voiceText');if(vt)vt.textContent=text;if(panel)panel.classList.add('show');if(!window.speechSynthesis||(!profile.voice.enabled&&!force))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=availableVoices().find(x=>x.voiceURI===profile.voice.voiceURI);if(v)u.voice=v;u.rate=profile.voice.rate||.92;u.pitch=profile.voice.pitch||1;window.speechSynthesis.speak(u)}
function replayVoice(){if(lastSpoken)speak(lastSpoken,true)}
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;const b=document.getElementById('installBtn');if(b)b.classList.remove('hidden')});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;const b=document.getElementById('installBtn');if(b)b.classList.add('hidden')});
async function installSteady(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(e){}deferredInstallPrompt=null;const b=document.getElementById('installBtn');if(b)b.classList.add('hidden');return}alert('To add Steady to your Home Screen, open your browser menu and choose “Install app” or “Add to Home screen.”')}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
init();
</script>
</body>
</html>
